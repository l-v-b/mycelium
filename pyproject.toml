[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycelium-palace"
version = "2.6.0"
description = "A unified memory system for AI agents: verbatim captures (drawers), curated notes, and typed links — over MCP."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Liam Blignaut", email = "lvblignaut@gmail.com" },
]
keywords = ["mcp", "memory", "ai", "claude", "fastmcp", "knowledge-graph", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=2.0",
    # Embedder: direct onnxruntime + the bundled all-MiniLM-L6-v2 model
    # (mycelium/_models/, loaded by mycelium/embedder.py). Replaces the heavy
    # chromadb dependency, which was previously pulled in ONLY for this embedder
    # (the vector store is pgvector — mycelium/db.py). Vectors are byte-identical
    # to the old chromadb embedder (same model.onnx + forward pass), so no reindex.
    "onnxruntime>=1.16",
    "tokenizers>=0.15",
    "numpy>=1.23",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.0",
    "python-frontmatter>=1.1",
]

[project.optional-dependencies]
# Prometheus metrics export (optional in any mode; metrics.py no-ops without it).
# redis dropped — the team async write path was removed when storage moved to
# synchronous pgvector (v2.3.0).
metrics = [
    "prometheus-client>=0.20",
]

[project.urls]
Homepage = "https://github.com/l-v-b/mycelium"
Repository = "https://github.com/l-v-b/mycelium"
Issues = "https://github.com/l-v-b/mycelium/issues"

[project.scripts]
mycelium = "mycelium.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mycelium"]
artifacts = [
    "mycelium/hooks/*.py",
    "mycelium/skills/**/*",
    "mycelium/_models/**/*",
]
