[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycelium-palace"
version = "1.1.0"
description = "A unified memory system for AI agents: verbatim captures (drawers), curated notes, and typed links — over MCP."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Liam Blignaut", email = "lvblignaut@gmail.com" },
]
keywords = ["mcp", "memory", "ai", "claude", "fastmcp", "knowledge-graph", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=2.0",
    "chromadb>=0.6",
    "pydantic>=2.0",
    "python-frontmatter>=1.1",
]

[project.optional-dependencies]
team = [
    "redis>=5.0",
    "prometheus-client>=0.20",
]

[project.urls]
Homepage = "https://github.com/l-v-b/mycelium"
Repository = "https://github.com/l-v-b/mycelium"
Issues = "https://github.com/l-v-b/mycelium/issues"

[project.scripts]
mycelium = "mycelium.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mycelium"]
artifacts = [
    "mycelium/hooks/*.py",
    "mycelium/skills/**/*",
]
