name: Publish to PyPI

# Triggered on version tags. Builds the sdist + wheel with uv,
# then publishes to PyPI via Trusted Publisher (OIDC) — no API token
# in repo secrets.
#
# Trusted Publisher configuration (one-time, on pypi.org):
#   - Project: mycelium-palace
#   - Owner: l-v-b
#   - Repository: mycelium
#   - Workflow filename: publish.yml
#   - Environment: pypi

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mycelium-palace/
    permissions:
      id-token: write   # OIDC token for Trusted Publisher
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8

      - name: Build sdist + wheel
        run: uv build

      - name: Sanity-check artefacts
        run: ls -la dist/

      - name: Publish to PyPI
        run: uv publish
