name: Publish to PyPI

# Triggered on version tags (v*.*.*). Builds the sdist + wheel with uv, then
# publishes to PyPI via Trusted Publisher (OIDC) — no API token in repo secrets.
#
# Targets production PyPI. `uv publish` defaults to https://upload.pypi.org/legacy/,
# so no --publish-url is needed. (During shake-out this pointed at TestPyPI; the
# TestPyPI project remains at https://test.pypi.org/project/mycelium-palace/.)
#
# PyPI Trusted Publisher configuration (one-time, before the first tag):
#   - URL: https://pypi.org/manage/account/publishing/
#   - Project: mycelium-palace (use "Add a pending publisher" — the project does
#     not yet exist on prod PyPI; pending publishers promote on first publish)
#   - Owner: l-v-b
#   - Repository: mycelium
#   - Workflow filename: publish.yml
#   - Environment: pypi

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mycelium-palace/
    permissions:
      id-token: write   # OIDC token for Trusted Publisher
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        # NB: astral-sh/setup-uv does not publish a rolling `v8` major tag —
        # only specific versions like `v8.0.0`/`v8.1.0` exist. Pin to the
        # exact latest; bump when newer versions ship.
        uses: astral-sh/setup-uv@v8.1.0

      - name: Build sdist + wheel
        run: uv build

      - name: Sanity-check artefacts
        run: ls -la dist/

      - name: Publish to PyPI
        run: uv publish
