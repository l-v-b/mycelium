name: Publish to TestPyPI

# Triggered on version tags. Builds the sdist + wheel with uv, then
# publishes to TestPyPI via Trusted Publisher (OIDC) — no API token
# in repo secrets.
#
# Currently targets TestPyPI for shake-out. Once the OIDC flow is
# verified end-to-end and the package looks correct on test.pypi.org,
# a follow-up will either:
#   (a) flip --publish-url back to main PyPI, OR
#   (b) split into two jobs / two workflows triggered by different
#       tag patterns (e.g. "tv*.*.*" for test, "v*.*.*" for prod).
#
# TestPyPI Trusted Publisher configuration (one-time):
#   - URL: https://test.pypi.org/manage/account/publishing/
#   - Project: mycelium-palace (use "Add a pending publisher" — the
#     project does not yet exist on TestPyPI; pending publishers are
#     promoted to real ones on first successful publish)
#   - Owner: l-v-b
#   - Repository: mycelium
#   - Workflow filename: publish.yml
#   - Environment: testpypi

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Build and publish to TestPyPI
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/mycelium-palace/
    permissions:
      id-token: write   # OIDC token for Trusted Publisher
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        # NB: astral-sh/setup-uv does not publish a rolling `v8` major tag —
        # only specific versions like `v8.0.0`/`v8.1.0` exist. Pin to the
        # exact latest; bump when newer versions ship.
        uses: astral-sh/setup-uv@v8.1.0

      - name: Build sdist + wheel
        run: uv build

      - name: Sanity-check artefacts
        run: ls -la dist/

      - name: Publish to TestPyPI
        run: uv publish --publish-url https://test.pypi.org/legacy/
